services:
  nginx:
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - frontend_dist:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:5173:80"
      - "127.0.0.1:8443:443"
  frontend:
    image: j1-noc-platform-frontend:latest
    build: {}
